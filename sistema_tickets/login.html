<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Inicio de sesión - Innovent Gestión de Tickets">

  <title>Iniciar sesión | Innovent</title>

  <link rel="stylesheet" href="/assets/css/styles1.css">
  <link rel="shortcut icon" href="assets/images/logo.png" type="image/x-icon">
</head>

<body class="login-page">

  <main class="login-container">

    <section class="login-card">

      <div class="login-brand">

        <div class="brand-mark">
          IG
        </div>

        <div>
          <strong>Innovent</strong>
          <span>Gestión inteligente</span>
        </div>

      </div>

      <div class="login-header">

        <span class="eyebrow">
          CENTRO DE SOPORTE
        </span>

        <h1>Iniciar sesión</h1>

        <p>
          Accede al sistema de gestión de tickets.
        </p>

      </div>

      <form id="loginForm">

        <div class="login-field">

          <label for="email">
            Correo electrónico
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="usuario@innovent.com"
            autocomplete="username"
            required
          >

        </div>

        <div class="login-field">

          <label for="password">
            Contraseña
          </label>

          <div class="password-wrapper">

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Ingresa tu contraseña"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              id="togglePassword"
              class="password-toggle"
              aria-label="Mostrar contraseña"
            >
              👁
            </button>

          </div>

        </div>

        <div class="login-options">

          <label class="remember-option">

            <input
              type="checkbox"
              id="remember"
            >

            <span>Recordarme</span>

          </label>

          <a href="#" id="forgotPassword">
            ¿Olvidaste tu contraseña?
          </a>

        </div>

        <button
          type="submit"
          class="primary-btn login-btn"
        >
          Iniciar sesión
        </button>

        <div
          id="loginMessage"
          class="login-message"
        ></div>

      </form>

      <div class="login-footer">

        <span>
          Innovent Servicios TI
        </span>

        <small>
          Sistema de gestión de tickets
        </small>

      </div>

    </section>

  </main>

  <script src="js/login.js"></script>

</body>
</html>
