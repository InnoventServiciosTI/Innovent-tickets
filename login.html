<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Inicio de sesión de Innovent Gestión de Tickets"
    />
    <meta name="theme-color" content="#10111f" />

    <title>Iniciar sesión | Innovent</title>

    <link rel="stylesheet" href="/assets/css/login.css" />
    <link rel="shortcut icon" href="/assets/images/logo.png" type="image/png" />
  </head>

  <body class="login-page">
    <main class="login-container">
      <section class="login-card">
        <!-- Marca -
        <div class="login-brand">
          <div>
            <strong>Innovent</strong>
            <span>Soluciones Digitales</span>
          </div>
        </div>-->

        <!-- Encabezado -->
        <div class="login-header">
          <span class="eyebrow">INNOVENT SERVICIOS TI - INICIAR SESION</span>
          <!--<h1>Iniciar sesión</h1>
          <p>INICIAR SESION.</p>-->
        </div>

        <!-- Formulario -->
        <form id="loginForm" novalidate>
          <fieldset class="role-section">
            <legend>Selecciona tu perfil de acceso</legend>

            <div class="role-options">
              <!-- Administrador -->
              <label class="role-card" for="roleAdmin">
                <input
                  type="radio"
                  id="roleAdmin"
                  name="role"
                  value="admin"
                  required
                />

                <span class="role-content">
                  <span class="role-icon" aria-hidden="true">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z" />
                      <path d="m9 12 2 2 4-4" />
                    </svg>
                  </span>

                  <span class="role-title">Administrador</span>
                  <span class="role-description">
                    Gestión y supervisión del sistema
                  </span>
                </span>
              </label>

              <!-- Usuario -->
              <label class="role-card" for="roleUser">
                <input
                  type="radio"
                  id="roleUser"
                  name="role"
                  value="user"
                  required
                />

                <span class="role-content">
                  <span class="role-icon" aria-hidden="true">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <circle cx="12" cy="8" r="4" />
                      <path d="M5 21v-2a7 7 0 0 1 14 0v2" />
                    </svg>
                  </span>

                  <span class="role-title">Usuario</span>
                  <span class="role-description">
                    Creación y seguimiento de tickets
                  </span>
                </span>
              </label>
            </div>
          </fieldset>

          <!-- Correo -->
          <div class="login-field">
            <label for="email">Correo electrónico</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="usuario@innovent.com"
              autocomplete="username"
              required
            />
          </div>

          <!-- Contraseña -->
          <div class="login-field">
            <label for="password">Contraseña</label>

            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Ingresa tu contraseña"
                autocomplete="current-password"
                required
              />

              <button
                type="button"
                id="togglePassword"
                class="password-toggle"
                aria-label="Mostrar contraseña"
                aria-controls="password"
                aria-pressed="false"
              >
                <span aria-hidden="true">👁</span>
              </button>
            </div>
          </div>

          <!-- Opciones -->
          <div class="login-options">
            <label class="remember-option" for="remember">
              <input type="checkbox" id="remember" name="remember" />
              <span>Recordarme</span>
            </label>
          </div>

          <!-- Acceso -->
          <button type="submit" class="primary-btn login-btn" id="loginButton">
            Iniciar sesión
          </button>

          <!-- Mensajes -->
          <div
            id="loginMessage"
            class="login-message"
            role="status"
            aria-live="polite"
          ></div>
        </form>

        <!-- Pie de página -->
        <footer class="login-footer">
          <span>Innovent Servicios TI</span>
          <small>Sistema de gestión de tickets</small>
        </footer>
      </section>
    </main>

    <script src="./assets/js/login.js" defer></script>
  </body>
</html>
